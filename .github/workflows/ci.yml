name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Validate frozen data
        run: pnpm fetch-data:check
      - name: Fixture pipeline (no live scrape)
        run: pnpm fetch-data -- --from-fixtures --out-dir "$RUNNER_TEMP/poe2-fixture-out"
      - name: Build web
        run: pnpm --filter web build
        env:
          GITHUB_PAGES: "true"
